services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: devbhoomi
      POSTGRES_USER: devbhoomi
      POSTGRES_PASSWORD: devbhoomi_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devbhoomi -d devbhoomi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
