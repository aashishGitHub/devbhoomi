services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: devtatva
      POSTGRES_USER: devtatva
      POSTGRES_PASSWORD: devtatva_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devtatva -d devtatva"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
